name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-capacitor-work
      - native-notifications-v0.3
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'native/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Refresh root dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install web dependencies
        run: npm ci

      - name: Test web app
        run: npm test

      - name: Build web bundle for Capacitor
        run: npm run build -- --mode capacitor

      - name: Refresh native dependency lock
        working-directory: native
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install Capacitor wrapper dependencies
        working-directory: native
        run: npm ci

      - name: Generate Android project
        working-directory: native
        run: npx cap add android

      - name: Sync web assets and native plugins
        working-directory: native
        run: npx cap sync android

      - name: Apply Android permissions
        run: node native/scripts/prepare-android.mjs

      - name: Build debug APK and unsigned release AAB
        working-directory: native/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Commit refreshed lockfiles
        if: github.ref_name == 'native-notifications-v0.3'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json native/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are current"
            exit 0
          fi
          git commit -m "build: refresh native notification lockfiles [skip ci]"
          git push

      - name: Upload Miqati debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miqati-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Miqati unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: miqati-android-release-aab-unsigned
          path: native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
