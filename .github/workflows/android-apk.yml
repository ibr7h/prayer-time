name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-capacitor-work
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'native/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Test web app
        run: npm test

      - name: Build web bundle for Capacitor
        run: npm run build -- --mode capacitor

      - name: Install Capacitor wrapper dependencies
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: native
        run: npx cap add android

      - name: Sync web assets and native plugins
        working-directory: native
        run: npx cap sync android

      - name: Apply Android permissions
        run: node native/scripts/prepare-android.mjs

      - name: Build debug APK
        working-directory: native/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Miqati debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miqati-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
