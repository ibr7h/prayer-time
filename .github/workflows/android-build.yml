name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - android-capacitor
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK 36 is available
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # package.json intentionally gains Capacitor on this branch before the lockfile
      # is regenerated. npm install keeps the build usable while producing a new lockfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build native web bundle
        run: npm run build:android

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK and unsigned release AAB
        shell: bash
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug bundleRelease

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: miqati-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: miqati-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
