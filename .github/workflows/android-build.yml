name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - android-capacitor
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK 36 is available
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under ANDROID_HOME=${ANDROID_HOME}"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # package.json gains Capacitor on this branch before the committed lockfile
      # is regenerated. npm install keeps this first native build reproducible enough
      # to validate the Android path; the lockfile can then be committed from the result.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build native web bundle
        run: npm run build:android

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK and unsigned release AAB
        shell: bash
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug bundleRelease

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: miqati-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v7
        with:
          name: miqati-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
