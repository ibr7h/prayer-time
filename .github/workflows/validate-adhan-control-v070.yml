name: Validate Adhan Control v0.7.0
on:
  push:
    branches: [adhan-control-native-sound-v0.7.0]
    paths:
      - '.github/workflows/validate-adhan-control-v070.yml'
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build -- --mode capacitor
      - name: Verify short sounds
        run: |
          test -s native/sounds/adhan_default_short.wav
          test -s native/sounds/adhan_fajr_short.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 native/sounds/adhan_default_short.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 native/sounds/adhan_fajr_short.wav

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build -- --mode capacitor
      - name: Install native dependencies
        working-directory: native
        run: npm ci
      - name: Generate Android project
        working-directory: native
        run: npx cap add android
      - name: Sync Android
        working-directory: native
        run: npx cap sync android
      - name: Bundle sounds and permissions
        run: |
          node native/scripts/prepare-native-sounds.mjs android
          node native/scripts/prepare-android.mjs
          cmp native/sounds/adhan_default_short.wav native/android/app/src/main/res/raw/adhan_default_short.wav
          cmp native/sounds/adhan_fajr_short.wav native/android/app/src/main/res/raw/adhan_fajr_short.wav
      - name: Compile Android debug APK
        working-directory: native/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --mode capacitor
      - name: Install native dependencies
        working-directory: native
        run: npm ci
      - name: Generate iOS project
        working-directory: native
        run: npx cap add ios
      - name: Sync iOS
        working-directory: native
        run: npx cap sync ios
      - name: Bundle iOS notification sounds
        working-directory: native
        run: |
          node scripts/prepare-native-sounds.mjs ios
          ruby scripts/add-ios-sounds.rb
          test -s ios/App/App/adhan_default_short.wav
          test -s ios/App/App/adhan_fajr_short.wav
          grep -q "adhan_default_short.wav" ios/App/App.xcodeproj/project.pbxproj
          grep -q "adhan_fajr_short.wav" ios/App/App.xcodeproj/project.pbxproj
      - name: Compile iOS simulator app
        working-directory: native
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
