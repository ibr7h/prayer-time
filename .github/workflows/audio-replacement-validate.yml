name: Validate Replacement Audio
on:
  push:
    branches: [audio-replacements-v0.6.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build -- --mode capacitor
      - name: Verify replacement audio copied to builds
        shell: bash
        run: |
          test -s docs/audio/adhan-default.mp3
          test -s docs/audio/adhan-fajr.mp3
          test -s dist-android/audio/adhan-default.mp3
          test -s dist-android/audio/adhan-fajr.mp3
          test "$(git hash-object public/audio/adhan-default.mp3)" = "cea488b0f5696ab1b856e05119495f4ca0edbe7e"
          test "$(git hash-object public/audio/adhan-fajr.mp3)" = "7b177f38cfbd942a7a5d5be9d26dc1160d956ddd"
          cmp public/audio/adhan-default.mp3 docs/audio/adhan-default.mp3
          cmp public/audio/adhan-fajr.mp3 docs/audio/adhan-fajr.mp3
          cmp public/audio/adhan-default.mp3 dist-android/audio/adhan-default.mp3
          cmp public/audio/adhan-fajr.mp3 dist-android/audio/adhan-fajr.mp3
