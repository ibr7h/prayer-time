name: Validate iOS Native App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-notifications-v0.3
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'native/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Refresh root dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install web dependencies
        run: npm ci

      - name: Test web app
        run: npm test

      - name: Build web bundle for Capacitor
        run: npm run build -- --mode capacitor

      - name: Refresh native dependency lock
        working-directory: native
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install Capacitor wrapper dependencies
        working-directory: native
        run: npm ci

      - name: Generate iOS project
        working-directory: native
        run: npx cap add ios

      - name: Sync web assets and Local Notifications plugin
        working-directory: native
        run: npx cap sync ios

      - name: Bundle notification sounds into iOS app
        working-directory: native
        run: |
          node scripts/prepare-native-sounds.mjs ios
          ruby scripts/add-ios-sounds.rb

      - name: Compile iOS simulator app
        working-directory: native
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
