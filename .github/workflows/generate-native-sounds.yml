name: Generate Native Adhan Clips
on:
  push:
    branches: [adhan-control-native-sound-v0.7.0]
    paths:
      - '.github/workflows/generate-native-sounds.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate 24-second notification clips
        run: |
          mkdir -p native/sounds
          ffmpeg -y -i public/audio/adhan-default.mp3 -t 24 -ar 22050 -ac 1 -c:a pcm_s16le native/sounds/adhan_default_short.wav
          ffmpeg -y -i public/audio/adhan-fajr.mp3 -t 24 -ar 22050 -ac 1 -c:a pcm_s16le native/sounds/adhan_fajr_short.wav
          test -s native/sounds/adhan_default_short.wav
          test -s native/sounds/adhan_fajr_short.wav
      - name: Commit generated clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/sounds/adhan_default_short.wav native/sounds/adhan_fajr_short.wav
          git commit -m "audio: add short native adhan notification clips [skip ci]"
          git push
